name: Serper Trend Taramasi

on:
  schedule:
    # Production: her saat başı (00:00, 01:00, 02:00, ... UTC) tetiklenir.
    # Bu sadece "kontrol" tetikleyicisi — gerçek tarama, kullanıcının
    # Ayarlar'da seçtiği sıklık (scan_interval_minutes) henüz dolmadıysa
    # scan.py tarafından atlanır.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # "Run workflow" ile manuel de tetiklenebilir

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python scan.py
