name: Serper Trend Taramasi

on:
  schedule:
    # GitHub Actions'ın desteklediği en kısa aralık 5 dakikadır. 03, 08,
    # 13... dakikalarını kullanmak saat başı yoğunluğundan kaçınır.
    # Bu sadece kontrol tetikleyicisidir; gerçek tarama sıklığını scan.py,
    # kullanıcının scan_interval_minutes ayarına göre belirler.
    - cron: '3/5 * * * *'
  workflow_dispatch: {} # "Run workflow" ile manuel de tetiklenebilir

# Schedule olayları gecikebilir veya düşebilir; dış tetikleyici ve manuel
# çalıştırma aynı anda gelirse iki tarama birbirinin üstüne binmesin.
concurrency:
  group: serper-trend-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli secret kontrolü
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SHARED_SERPER_API_KEY: ${{ secrets.SHARED_SERPER_API_KEY }}
        run: |
          missing=()
          [[ -n "$SUPABASE_URL" ]] || missing+=(SUPABASE_URL)
          [[ -n "$SUPABASE_SERVICE_KEY" ]] || missing+=(SUPABASE_SERVICE_KEY)
          if [[ -z "$SERPER_API_KEY" && -z "$SHARED_SERPER_API_KEY" ]]; then
            missing+=(SERPER_API_KEY/SHARED_SERPER_API_KEY)
          fi
          if (( ${#missing[@]} )); then
            echo "Eksik GitHub Secret: ${missing[*]}" >&2
            exit 1
          fi
          echo "Gerekli GitHub Secret'lar mevcut."

      - name: Bağımlılıkları kur
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Taramayı çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SHARED_SERPER_API_KEY: ${{ secrets.SHARED_SERPER_API_KEY }}
        run: python -u scan.py
